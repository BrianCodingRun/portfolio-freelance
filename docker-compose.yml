services:
  app:
    image: ghcr.io/briancodingrun/portfolio-freelance:latest
    container_name: portfolio_app_new
    restart: unless-stopped
    ports:
      - "3001:3000"
    env_file:
      - .env.production
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
